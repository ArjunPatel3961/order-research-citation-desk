[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-research-citation-desk"
version = "0.1.0"
description = "Collect and deduplicate citations attached to e-commerce order research."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
